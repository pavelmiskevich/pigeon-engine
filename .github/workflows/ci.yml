name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PigeonEngine.slnx

      - name: Build
        run: dotnet build PigeonEngine.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution PigeonEngine.slnx -c Release --no-build

      # Проба возможностей платформы (S0.3): отчёт не валит сборку, на раннере без экрана
      # уровень будет низким. Отчёт без имени машины и пользователя.
      - name: Capability probe
        shell: bash
        run: |
          dotnet run --project tools/Pigeon.Probe -c Release --no-build -- --json > probe-${{ matrix.name }}.json || true
          dotnet run --project tools/Pigeon.Probe -c Release --no-build >> "$GITHUB_STEP_SUMMARY" || true

      # Самодостаточная сборка pigeon-probe для macOS: на macOS SDK подписывает её ad-hoc,
      # без этого Apple Silicon бинарник не запустит.
      - name: Publish probe for macOS
        if: matrix.name == 'macos-arm64'
        run: dotnet publish tools/Pigeon.Probe -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -p:InvariantGlobalization=true -p:DebugType=none -o artifacts/probe/osx-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.name }}
          path: |
            probe-${{ matrix.name }}.json
            artifacts/probe/osx-arm64
          if-no-files-found: ignore
          retention-days: 30

  # Ядро в .NET WebAssembly: те же эталонные хеши, что в .NET-тестах, в headless Chrome
  # (MVP-0, S0.7; ADR-0014, ADR-0016).
  core-in-wasm:
    name: core-in-wasm
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/wasm-check/package-lock.json

      - name: Publish harness
        run: dotnet publish tests/Pigeon.Wasm.Harness -c Release -o artifacts/wasm-harness

      - name: Install runner
        working-directory: tools/wasm-check
        run: npm ci --no-audit --no-fund

      - name: Check golden hashes in headless Chrome
        working-directory: tools/wasm-check
        run: node run.mjs ../../artifacts/wasm-harness/wwwroot

      - name: Report publish size
        run: node tools/wasm-check/publish-size.mjs artifacts/wasm-harness/wwwroot >> "$GITHUB_STEP_SUMMARY"
